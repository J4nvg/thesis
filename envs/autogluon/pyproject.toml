# ---------------------------------------------------------------------------
# Separate environment for the Chronos-2 experiment (`_chronos2.py`).
#
# WHY: AutoGluon 1.5.0 caps pandas<2.4 / numpy<2.4 / scipy<1.17, which is
# unsatisfiable together with the main project's frozen core (pandas 3.0.2,
# numpy 2.4.4, scipy 1.17.1). Forcing it in there installs but fails at import
# with `ImportError: cannot import name 'ArrayManager' from
# pandas.core.internals` (removed in pandas 3.0). See the comment block at the
# top of ../../pyproject.toml. This env is therefore standalone and is NOT part
# of the main uv workspace.
#
# Deviations from the historical pins (git show bcf16c8:requirements.txt) and
# from the main project's pins are documented in README.md next to this file.
# ---------------------------------------------------------------------------

[project]
name = "strikecast-autogluon"
version = "0.1.0"
description = "Isolated AutoGluon/Chronos-2 environment for _chronos2.py"
readme = "README.md"
# autogluon.timeseries 1.5.0 metadata: Requires-Python >=3.10,<3.14
requires-python = ">=3.12,<3.13"

dependencies = [
  # --- the reason this env exists ---
  "autogluon.timeseries==1.5.0",
  # --- core scientific stack (capped by autogluon 1.5.0) ---
  "numpy>=2.2,<2.4",          # autogluon: <2.4.0 ; darts 0.43.0: >=2.2.0
  "pandas>=2.2,<2.4",         # autogluon: <2.4.0 ; darts 0.43.0: >=2.2.0
  "scipy<1.17",               # autogluon: <1.17
  "pyarrow<21",               # autogluon-common: <21
  "matplotlib==3.10.9",
  "statsmodels==0.14.6",
  "scikit-learn==1.6.0",
  # --- legacy helper package `src` (repo root) needs darts + sklearn + mpl ---
  "darts[torch]==0.43.0",
  # --- DL / tuning (same pins as the main project) ---
  "torch==2.9.1",             # autogluon: >=2.6,<2.10 -> 2.9.1 allowed
  "pytorch-lightning==2.5.2", # darts[torch]: <2.5.3 ; autogluon lightning: <2.6
  "optuna==4.8.0",
  "optuna-integration==4.8.0",
  "tqdm==4.67.3",
  # --- what the `strikecast` pipeline needs at RUN time in this env (audit C15) ---
  # `strikecast run|tune|importance experiment=chronos2` composes the experiment
  # with Hydra, validates it with pydantic, mirrors to W&B (the experiment
  # default is `tracking: wandb_online`, D11) and imports
  # `strikecast.evaluation` (whose `__init__` imports `venn_abers`). Same pins as
  # the main project's `uv.lock` where the AutoGluon caps allow it.
  "hydra-core==1.3.7",
  "omegaconf==2.3.0",
  "pydantic==2.13.0",
  "pyyaml==6.0.3",
  "wandb==0.30.0",
  "venn-abers==1.5.3",
  # `strikecast.evaluation.__init__` also imports `stats`, which imports
  # `scikit_posthocs` at module level (same version as the main lock).
  "scikit-posthocs==0.17.0",
]

# `strikecast` is importable in this env WITHOUT `PYTHONPATH=src` (audit C15):
# the env is itself an (empty) editable package whose `.pth` file puts the
# repo's `src/` directory on `sys.path` -- the same thing the main env's
# editable install of `strikecast` does. `uv sync --project envs/autogluon`
# writes the ABSOLUTE path of the checkout it runs in, so sync on the machine
# (cluster checkout) that runs the jobs. The main project cannot be a path
# dependency here: it requires Python 3.13 and pins pandas 3 (see above).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build]
dev-mode-dirs = ["../../src"]

[tool.uv]
package = true

# Test-only. `uv sync --project envs/autogluon` installs the `dev` group by
# default, so the Chronos golden test (`tests/golden/test_chronos_equality.py`)
# is runnable in this env straight after a sync. Same pytest pin as the main
# project's dev extra.
[dependency-groups]
dev = [
  "pytest>=8",          # same constraint as the main project's dev extra
  # `venn-abers` and `hydra-core` used to be listed here; they are runtime
  # dependencies now (see `dependencies`).
]
